name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify bundled runtime assets
        run: npm run verify:runtime

  tauri-e2e:
    name: Tauri E2E (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri test binary
        run: npm run build:tauri:test

      - name: Run Tauri native-window tests
        run: npm run test:tauri

      - name: Upload Tauri E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-windows
          path: |
            test-results/
            wdio-report/
            logs/
          if-no-files-found: ignore
